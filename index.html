<!DOCTYPE html>
<html lang="id">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Alfin & Safgia - Kenangan Bersama</title>
	<script src="https://cdn.tailwindcss.com"></script>
	<script src="https://unpkg.com/feather-icons"></script>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
	<script>
		tailwind.config = {
			theme: {
				extend: {
					fontFamily: {
						sans: ['Poppins', 'sans-serif'],
					},
					animation: {
						'fade-in': 'fadeIn 0.5s ease-in',
						'slide-up': 'slideUp 0.4s ease-out',
					},
					keyframes: {
						fadeIn: {
							'0%': { opacity: '0' },
							'100%': { opacity: '1' },
						},
						slideUp: {
							'0%': { transform: 'translateY(20px)', opacity: '0' },
							'100%': { transform: 'translateY(0)', opacity: '1' },
						},
					},
				},
			},
		}
	</script>
	<style>
		.fade-in {
			animation: fadeIn 0.5s ease-in;
		}
		.slide-up {
			animation: slideUp 0.4s ease-out;
		}
	</style>
</head>
<body class="bg-gradient-to-br from-gray-900 via-gray-800 to-slate-900">
	<div id="app" class="flex flex-col min-h-screen">
		<header id="app-header" class="fixed top-0 left-0 right-0 z-[1000] bg-gray-900/95 backdrop-blur-sm shadow-2xl border-b border-gray-700">
			<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4">
				<div class="flex items-center justify-between">
					<div class="flex items-center gap-3">
						<button id="mobile-menu-btn" class="md:hidden p-2 hover:bg-gradient-to-r hover:from-gray-800 hover:to-gray-700 rounded-xl transition-all duration-300 transform hover:scale-105">
							<i data-feather="menu" class="w-6 h-6 text-blue-400"></i>
						</button>
						<button id="desktop-toggle-btn" class="hidden md:block p-2 hover:bg-gradient-to-r hover:from-gray-800 hover:to-gray-700 rounded-xl transition-all duration-300 transform hover:scale-105">
							<i data-feather="menu" class="w-6 h-6 text-blue-400"></i>
						</button>
						<a href="#home" class="flex items-center gap-2 hover:opacity-80 transition-opacity duration-300 cursor-pointer group">
							<div class="relative">
								<svg class="w-10 h-10 text-blue-500 group-hover:text-cyan-400 transition-colors duration-300" fill="currentColor" viewBox="0 0 24 24">
									<path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
								</svg>
								<span class="absolute -top-1 -right-1 w-3 h-3 bg-gradient-to-r from-blue-500 to-cyan-500 rounded-full group-hover:scale-110 transition-transform duration-300"></span>
							</div>
							<div>
								<h1 class="text-xl md:text-2xl font-bold bg-gradient-to-r from-blue-400 via-cyan-400 to-teal-400 bg-clip-text text-transparent group-hover:from-cyan-400 group-hover:via-teal-400 group-hover:to-blue-400 transition-all duration-300">Alfin & Safgia</h1>
								<p class="text-xs text-blue-300 font-medium group-hover:text-cyan-300 transition-colors duration-300">Kenangan Bersama</p>
							</div>
						</a>
					</div>
					<nav id="app-navbar" class="flex items-center gap-2">
					</nav>
				</div>
			</div>
			<div id="breadcrumb-container" class="border-t border-gray-700/50"></div>
		</header>
		<div id="app-content-wrapper" class="flex flex-1 relative mt-[73px]">
			<div id="sidebar-overlay" class="fixed inset-0 z-[890] bg-black/60 hidden transition-all duration-300"></div>
			<aside id="app-sidebar" class="fixed top-[73px] left-0 bottom-0 w-[280px] z-[900] bg-gray-900/95 backdrop-blur-sm border-r border-gray-700 overflow-y-auto transform -translate-x-full transition-transform duration-300 ease-in-out shadow-2xl pt-6">
			</aside>
			<main id="app-main" class="flex-1 ml-0 pb-8">
			</main>
		</div>
		<footer id="app-footer" class="bg-gradient-to-r from-gray-900 via-gray-800 to-slate-900 border-t border-gray-700 py-8 px-4 ml-0 mt-auto">
			<div class="max-w-7xl mx-auto text-center space-y-2">
				<h2 class="text-2xl md:text-3xl font-bold bg-gradient-to-r from-blue-400 via-cyan-400 to-teal-400 bg-clip-text text-transparent">Alfin & Safgia</h2>
				<p class="text-sm text-gray-400 font-medium">01-02-2026</p>
				<p class="text-sm text-gray-300">Dibuat dengan <span class="text-blue-500 animate-pulse inline-block">❤</span> untuk momen-momen berharga kami</p>
			</div>
		</footer>
	</div>
	<script type="module" src="./app.js"></script>
</body>
</html>
